[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "opencart-mcp"
version = "0.7.0"
description = "MCP server for LiveStore/OpenCart 3 + Technics — query products, orders, theme settings, and modules via any MCP client. Supports direct MySQL, remote VPS (SSH), and local DDEV."
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Chris Bray" },
]
readme = "README.md"
keywords = ["opencart", "livestore", "ocstore", "technics", "mcp", "model-context-protocol", "ecommerce"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "fastmcp>=2.0.0",
    "paramiko>=3.0.0",
    "pymysql>=1.1.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
opencart-mcp = "opencart_mcp.server:main"

[project.urls]
Homepage = "https://github.com/Penikov/livestore-mcp"
Repository = "https://github.com/Penikov/livestore-mcp"
Issues = "https://github.com/Penikov/livestore-mcp/issues"

[tool.setuptools.packages.find]
where = ["src"]
